<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage API Tester</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.8;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        button.success {
            background: #27ae60;
        }

        button.success:hover {
            background: #219a52;
        }

        .response {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background: white;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-info {
            flex: 1;
        }

        .file-actions {
            display: flex;
            gap: 5px;
        }

        .file-name {
            font-weight: 600;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .action-btn {
            padding: 4px 8px;
            font-size: 0.8em;
            width: auto;
        }

        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            text-align: center;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .token-display {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            word-break: break-all;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>☁️ Cloud Storage API Tester</h1>
        <div class="subtitle">Test your Rust backend endpoints</div>
    </header>

    <div class="main-content">
        <!-- Authentication Section -->
        <div class="section">
            <h2>🔐 Authentication</h2>

            <div class="form-group">
                <label for="baseUrl">API Base URL:</label>
                <input type="text" id="baseUrl" value="http://localhost:3000/api" placeholder="http://localhost:3000/api">
            </div>

            <div class="form-group">
                <label for="registerUsername">Username:</label>
                <input type="text" id="registerUsername" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label for="registerEmail">Email:</label>
                <input type="email" id="registerEmail" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label for="registerPassword">Password:</label>
                <input type="password" id="registerPassword" placeholder="Enter password">
            </div>

            <div class="form-group">
                <button onclick="register()" class="success">Register User</button>
                <button onclick="login()">Login</button>
            </div>

            <div id="tokenDisplay" class="token-display" style="display: none;">
                <strong>JWT Token:</strong> <span id="tokenValue"></span>
            </div>
        </div>

        <!-- File Management Section -->
        <div class="section">
            <h2>📁 File Management</h2>

            <div class="form-group">
                <label for="fileInput">Select File to Upload:</label>
                <input type="file" id="fileInput">
            </div>

            <div class="form-group">
                <button onclick="uploadFile()" class="success">Upload File</button>
                <button onclick="listFiles()">Refresh File List</button>
            </div>

            <div id="fileList" class="file-list">
                <!-- File list will be populated here -->
                <div style="text-align: center; color: #666; padding: 20px;">
                    No files uploaded yet
                </div>
            </div>
        </div>

        <!-- Response Section -->
        <div class="section" style="grid-column: 1 / -1;">
            <h2>📊 API Responses</h2>
            <div id="statusMessage"></div>
            <div id="response" class="response">
                API responses will appear here...
            </div>
        </div>
    </div>
</div>

<script>
    let currentToken = '';
    let currentFiles = [];

    // Utility functions
    function showStatus(message, type = 'success') {
        const statusEl = document.getElementById('statusMessage');
        statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
        setTimeout(() => statusEl.innerHTML = '', 5000);
    }

    function showResponse(data) {
        document.getElementById('response').textContent = JSON.stringify(data, null, 2);
    }

    function getBaseUrl() {
        let base = document.getElementById('baseUrl').value;

        base = base.replace(/\/$/, '');
        return base;
    }

    // Authentication functions
    async function register() {
        const username = document.getElementById('registerUsername').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;

        if (!username || !email || !password) {
            showStatus('Please fill all fields', 'error');
            return;
        }

        try {
            const response = await fetch(`${getBaseUrl()}/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();
            showResponse(data);

            if (response.ok) {
                showStatus('Registration successful!');
                // Clear form
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerEmail').value = '';
                document.getElementById('registerPassword').value = '';
            } else {
                showStatus('Registration failed', 'error');
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Request failed', 'error');
        }
    }

    async function login() {
        const username = document.getElementById('registerUsername').value;
        const password = document.getElementById('registerPassword').value;

        if (!username || !password) {
            showStatus('Please enter username and password', 'error');
            return;
        }

        try {
            const response = await fetch(`${getBaseUrl()}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            showResponse(data);

            if (response.ok && data.token) {
                currentToken = data.token;
                document.getElementById('tokenValue').textContent = currentToken;
                document.getElementById('tokenDisplay').style.display = 'block';
                showStatus('Login successful!');
                // Load files after login
                listFiles();
            } else {
                showStatus('Login failed', 'error');
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Request failed', 'error');
        }
    }

    // File management functions
    async function uploadFile() {
        if (!currentToken) {
            showStatus('Please login first', 'error');
            return;
        }

        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            showStatus('Please select a file', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch(`${getBaseUrl()}/upload`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${currentToken}`
                },
                body: formData
            });

            const data = await response.json();
            showResponse(data);

            if (response.ok) {
                showStatus('File uploaded successfully!');
                fileInput.value = ''; // Clear file input
                listFiles(); // Refresh file list
            } else {
                showStatus('Upload failed', 'error');
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Upload failed', 'error');
        }
    }

    async function listFiles() {
        if (!currentToken) {
            showStatus('Please login first', 'error');
            return;
        }

        try {
            const response = await fetch(`${getBaseUrl()}/files`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${currentToken}`
                }
            });

            const data = await response.json();
            showResponse(data);

            if (response.ok) {
                currentFiles = data.files || [];
                renderFileList();
                showStatus('Files loaded successfully!');
            } else {
                showStatus('Failed to load files', 'error');
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Request failed', 'error');
        }
    }

    async function downloadFile(fileId, filename) {
        if (!currentToken) {
            showStatus('Please login first', 'error');
            return;
        }

        try {
            const response = await fetch(`${getBaseUrl()}/files/${fileId}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${currentToken}`
                }
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showStatus('File download started!');
            } else {
                const error = await response.text();
                showStatus('Download failed', 'error');
                showResponse({ error });
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Download failed', 'error');
        }
    }

    async function deleteFile(fileId) {
        if (!currentToken) {
            showStatus('Please login first', 'error');
            return;
        }

        if (!confirm('Are you sure you want to delete this file?')) {
            return;
        }

        try {
            const response = await fetch(`${getBaseUrl()}/files/${fileId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${currentToken}`
                }
            });

            const data = await response.json();
            showResponse(data);

            if (response.ok) {
                showStatus('File deleted successfully!');
                listFiles(); // Refresh file list
            } else {
                showStatus('Delete failed', 'error');
            }
        } catch (error) {
            showResponse({ error: error.message });
            showStatus('Delete failed', 'error');
        }
    }

    function renderFileList() {
        const fileListEl = document.getElementById('fileList');

        if (currentFiles.length === 0) {
            fileListEl.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No files uploaded yet</div>';
            return;
        }

        fileListEl.innerHTML = currentFiles.map(file => `
                <div class="file-item">
                    <div class="file-info">
                        <div class="file-name">${file.original_name}</div>
                        <div class="file-size">${formatFileSize(file.size)} • ${new Date(file.uploaded_at).toLocaleDateString()}</div>
                    </div>
                    <div class="file-actions">
                        <button class="action-btn" onclick="downloadFile('${file.id}', '${file.original_name}')">📥</button>
                        <button class="action-btn danger" onclick="deleteFile('${file.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Cloud Storage API Tester loaded!');
    });
</script>
</body>
</html>
